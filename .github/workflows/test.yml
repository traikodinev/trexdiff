name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test-c:
    name: C tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install CBLAS and OpenBLAS
        run: |
          sudo apt-get update
          sudo apt-get install -y libblas-dev libopenblas-dev
      - name: Build and run tests
        run: make test
