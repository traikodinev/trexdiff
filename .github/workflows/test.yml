name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test-c:
    name: C tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install CBLAS and OpenBLAS
        run: |
          sudo apt-get update
          sudo apt-get install -y libblas-dev libopenblas-dev
      - name: Build and run tests
        run: make test
  test_py:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install CBLAS and OpenBLAS
        run: |
          sudo apt-get update
          sudo apt-get install -y libblas-dev libopenblas-dev
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and install trexdiff
        run: |
          make python
          pip install -e .
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.test.txt
      - name: Test with pytest
        run: pytest python/tests/
